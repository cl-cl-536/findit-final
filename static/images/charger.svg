<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F1F5F9"/>
  <circle cx="200" cy="150" r="100" fill="#E2E8F0" opacity="0.6"/>
  <!-- Laptop Charger -->
  <g transform="translate(110, 60)">
    <!-- Adapter Brick -->
    <rect x="20" y="40" width="140" height="90" rx="16" fill="#1E293B"/>
    <rect x="26" y="46" width="128" height="78" rx="12" fill="#0F172A"/>
    <!-- LED indicator -->
    <circle cx="140" cy="65" r="4" fill="#10B981"/>
    <!-- Embossed power rating -->
    <text x="80" y="92" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#64748B" text-anchor="middle">65W USB-C</text>
    
    <!-- Coiled Cable -->
    <path d="M160 85 C220 85 220 170 140 170 C60 170 60 210 120 210" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    
    <!-- USB-C Plug tip -->
    <rect x="120" y="204" width="28" height="12" rx="4" fill="#94A3B8"/>
    <rect x="148" y="206" width="14" height="8" rx="2" fill="#CBD5E1"/>
    
    <!-- AC Cable plug end -->
    <path d="M20 85 C-10 85 -10 130 10 150" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <rect x="10" y="140" width="18" height="24" rx="4" fill="#1E293B"/>
    <line x1="14" y1="164" x2="14" y2="174" stroke="#94A3B8" stroke-width="3"/>
    <line x1="24" y1="164" x2="24" y2="174" stroke="#94A3B8" stroke-width="3"/>
  </g>
</svg>

