<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="110" fill="#E2E8F0" opacity="0.6"/>
  <!-- Lanyard Ribbon -->
  <path d="M120 0 C160 60 160 80 185 100 M280 0 C240 60 240 80 215 100" stroke="#2563EB" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Metal clip -->
  <rect x="188" y="95" width="24" height="15" rx="3" fill="#94A3B8"/>
  <rect x="195" y="105" width="10" height="18" rx="2" fill="#64748B"/>
  <!-- ID Badge Body -->
  <g transform="translate(100, 115)">
    <!-- Badge Holder -->
    <rect x="0" y="0" width="200" height="135" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Top banner -->
    <rect x="0" y="0" width="200" height="34" rx="14" fill="#172554"/>
    <rect x="0" y="20" width="200" height="14" fill="#172554"/>
    <text x="100" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CAMPUS IDENTITY CARD</text>
    <!-- Photo Box -->
    <rect x="18" y="46" width="50" height="60" rx="8" fill="#DBEAFE"/>
    <circle cx="43" cy="66" r="14" fill="#3B82F6"/>
    <path d="M26 98 C26 84 60 84 60 98" fill="#3B82F6"/>
    <!-- Student Details Placeholder Lines -->
    <rect x="80" y="50" width="95" height="10" rx="3" fill="#1E293B"/>
    <rect x="80" y="66" width="70" height="7" rx="2" fill="#64748B"/>
    <rect x="80" y="78" width="85" height="7" rx="2" fill="#94A3B8"/>
    <!-- Barcode -->
    <line x1="80" y1="96" x2="80" y2="108" stroke="#1E293B" stroke-width="2"/>
    <line x1="84" y1="96" x2="84" y2="108" stroke="#1E293B" stroke-width="3"/>
    <line x1="90" y1="96" x2="90" y2="108" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="94" y1="96" x2="94" y2="108" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="100" y1="96" x2="100" y2="108" stroke="#1E293B" stroke-width="1"/>
    <line x1="104" y1="96" x2="104" y2="108" stroke="#1E293B" stroke-width="3"/>
    <line x1="110" y1="96" x2="110" y2="108" stroke="#1E293B" stroke-width="2"/>
    <!-- Gold University Crest dot -->
    <circle cx="180" cy="98" r="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
</svg>

