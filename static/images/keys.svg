<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="105" fill="#E2E8F0" opacity="0.6"/>
  <!-- Keychain with Fob and Keys -->
  <g transform="translate(140, 40)">
    <!-- Woven Lanyard loop -->
    <path d="M40 0 C0 60 20 110 50 120 M80 0 C120 60 100 110 70 120" stroke="#172554" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M40 0 C0 60 20 110 50 120 M80 0 C120 60 100 110 70 120" stroke="#3B82F6" stroke-width="4" stroke-dasharray="6,4" fill="none" stroke-linecap="round"/>
    
    <!-- Metal Clamp -->
    <rect x="46" y="112" width="28" height="18" rx="4" fill="#94A3B8"/>
    <!-- Keyring -->
    <circle cx="60" cy="144" r="18" fill="none" stroke="#64748B" stroke-width="5"/>
    
    <!-- Key 1 (Silver Brass) -->
    <g transform="rotate(25 60 144)">
      <circle cx="60" cy="160" r="10" fill="#94A3B8"/>
      <circle cx="60" cy="160" r="4" fill="#F8FAFC"/>
      <path d="M57 168 L57 235 L67 235 L67 220 L64 216 L67 210 L63 205 L67 195 L63 168 Z" fill="#94A3B8"/>
    </g>
    
    <!-- Key 2 (Car Remote Fob) -->
    <g transform="rotate(-20 60 144)">
      <rect x="42" y="160" width="36" height="60" rx="14" fill="#1E293B"/>
      <!-- Fob buttons -->
      <circle cx="60" cy="176" r="6" fill="#334155"/>
      <circle cx="60" cy="194" r="6" fill="#334155"/>
      <circle cx="60" cy="208" r="3" fill="#EF4444"/>
    </g>
  </g>
</svg>

